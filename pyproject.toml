[project]
name = "chipt"
version = "0.1.0"
description = "Results Viewer: aggregate amateur race results across providers and analyse them over time."
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Config: loads .env into typed settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # DB: DATABASE_URL uses postgresql+asyncpg (SQLAlchemy Core, no ORM)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Ingestion
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Analysis + MVP UI
    "pandas>=2.2",
]

[project.optional-dependencies]
# Only needed for JS-rendered provider sites (spec §5.1)
js = ["playwright>=1.45"]

[project.scripts]
chipt-ingest = "chipt.ingest.cli:main"
chipt-initdb = "chipt.db.init:main"
chipt-openapi = "chipt.api.openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chipt"]
